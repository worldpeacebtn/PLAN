<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <title>Helix Office · WorldPeace Hub</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        /* ── RESET & BASE ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #020205;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }
        .cyber-font {
            font-family: 'Orbitron', sans-serif;
        }

        /* ── 3D CONTAINER ── */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ── SCANLINE ── */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 255, 255, 0.08) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.15;
            pointer-events: none;
            z-index: 2;
            animation: scanline 8s linear infinite;
        }
        @keyframes scanline {
            0% {
                top: -100px;
            }
            100% {
                top: 100vh;
            }
        }

        /* ── GLASS PANEL ── */
        .glass-panel {
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 255, 255, 0.20);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.08);
        }
        .glass-panel-dark {
            background: rgba(5, 5, 18, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(0, 255, 255, 0.15);
        }

        /* ── GLITCH ── */
        .glitch-text {
            position: relative;
            display: inline-block;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.7;
            pointer-events: none;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 #ff00ff;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 #00ffff;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% {
                clip: rect(24px, 9999px, 14px, 0);
            }
            20% {
                clip: rect(85px, 9999px, 114px, 0);
            }
            40% {
                clip: rect(15px, 9999px, 90px, 0);
            }
            60% {
                clip: rect(104px, 9999px, 45px, 0);
            }
            80% {
                clip: rect(4px, 9999px, 80px, 0);
            }
            100% {
                clip: rect(50px, 9999px, 30px, 0);
            }
        }

        /* ── HUD LAYER ── */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        .clickable {
            pointer-events: auto;
        }

        /* ── LEFT SIDEBAR (REPOS) ── */
        #repo-sidebar {
            position: fixed;
            left: 12px;
            top: 80px;
            bottom: 80px;
            width: 220px;
            z-index: 20;
            pointer-events: auto;
            transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            padding: 0;
        }
        #repo-sidebar.collapsed {
            transform: translateX(-240px);
            opacity: 0;
        }
        #repo-sidebar .sidebar-header {
            padding: 12px 14px 8px 14px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.12);
            flex-shrink: 0;
        }
        #repo-sidebar .sidebar-header h3 {
            font-size: 10px;
            letter-spacing: 0.2em;
            color: #f0aaff;
            font-weight: 700;
        }
        #repo-sidebar .sidebar-header .sub {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.35);
            font-family: monospace;
            margin-top: 2px;
        }
        #repo-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #repo-list-container::-webkit-scrollbar {
            width: 3px;
        }
        #repo-list-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        #repo-list-container::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 4px;
        }

        .repo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px 6px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
            font-family: monospace;
        }
        .repo-item:hover {
            background: rgba(0, 255, 255, 0.07);
            border-color: rgba(0, 255, 255, 0.25);
        }
        .repo-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-right: 8px;
            transition: 0.2s;
        }
        .repo-item .dot.pink {
            background: #ff44ff;
            box-shadow: 0 0 8px #ff44ff66;
        }
        .repo-item .dot.blue {
            background: #44ffff;
            box-shadow: 0 0 8px #44ffff66;
        }
        .repo-item .dot.purple {
            background: #aa66ff;
            box-shadow: 0 0 8px #aa66ff66;
        }
        .repo-item .repo-name {
            flex: 1;
            color: rgba(255, 255, 255, 0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 10px;
        }
        .repo-item .star-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            cursor: pointer;
            padding: 0 2px;
            transition: 0.2s;
            line-height: 1;
        }
        .repo-item .star-btn.starred {
            color: #ffdd44;
            text-shadow: 0 0 12px #ffdd4488;
        }
        .repo-item .star-btn:hover {
            transform: scale(1.2);
        }
        .repo-item .html-badge {
            font-size: 7px;
            background: rgba(0, 255, 255, 0.12);
            padding: 1px 6px;
            border-radius: 10px;
            color: #88ffff;
            margin-left: 6px;
            letter-spacing: 0.05em;
            font-weight: 600;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .repo-item .html-badge:hover {
            background: rgba(0, 255, 255, 0.25);
        }

        /* ── TOGGLE SIDEBAR BTN ── */
        #toggle-sidebar {
            position: fixed;
            left: 12px;
            top: 12px;
            z-index: 25;
            pointer-events: auto;
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 6px 10px;
            color: #88ffff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #toggle-sidebar:hover {
            background: rgba(0, 255, 255, 0.12);
            border-color: #00ffff;
        }
        #toggle-sidebar .badge-count {
            font-size: 9px;
            background: rgba(255, 0, 255, 0.2);
            padding: 1px 8px;
            border-radius: 12px;
            color: #ff88ff;
        }

        /* ── TOP HUD ── */
        #top-hud {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 18px 6px 16px;
            border-radius: 40px;
            background: rgba(10, 15, 30, 0.55);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 255, 255, 0.12);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            justify-content: center;
        }
        #top-hud .brand {
            font-size: 14px;
            font-weight: 900;
            color: #88ffff;
            letter-spacing: 0.1em;
            font-family: 'Orbitron', sans-serif;
            white-space: nowrap;
        }
        #top-hud .brand span {
            color: #ff66ff;
        }
        #top-hud .hud-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.08);
        }
        #top-hud .hud-stat {
            font-size: 9px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        #top-hud .hud-stat strong {
            color: #ff88ff;
            font-weight: 700;
        }
        #top-hud .hud-stat .num {
            color: #88ffff;
            font-weight: 700;
        }
        #top-hud .hud-btn {
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.15);
            color: #88ffff;
            padding: 3px 12px;
            border-radius: 16px;
            font-size: 9px;
            font-family: monospace;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        #top-hud .hud-btn:hover {
            background: rgba(0, 255, 255, 0.18);
            border-color: #00ffff;
        }
        #top-hud .hud-btn.pink {
            background: rgba(255, 0, 255, 0.08);
            border-color: rgba(255, 0, 255, 0.2);
            color: #ff88ff;
        }
        #top-hud .hud-btn.pink:hover {
            background: rgba(255, 0, 255, 0.18);
        }

        /* ── APP TABS / WINDOW MANAGER ── */
        #app-dock {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 40px;
            background: rgba(5, 5, 18, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 255, 0.10);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            max-width: 92vw;
            overflow-x: auto;
            flex-wrap: nowrap;
            scrollbar-width: none;
        }
        #app-dock::-webkit-scrollbar {
            display: none;
        }
        .dock-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px 4px 10px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            font-size: 9px;
            font-family: monospace;
            cursor: pointer;
            transition: 0.25s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .dock-tab.active {
            background: rgba(0, 255, 255, 0.10);
            border-color: rgba(0, 255, 255, 0.30);
            color: #88ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.04);
        }
        .dock-tab .tab-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            transition: 0.2s;
        }
        .dock-tab .tab-close:hover {
            color: #ff4477;
        }
        .dock-tab .tab-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .dock-tab .tab-dot.pink {
            background: #ff44ff;
        }
        .dock-tab .tab-dot.blue {
            background: #44ffff;
        }
        .dock-tab .tab-dot.purple {
            background: #aa66ff;
        }
        .dock-tab .tab-label {
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dock-tab .tab-badge {
            font-size: 7px;
            background: rgba(255, 0, 255, 0.15);
            padding: 0 6px;
            border-radius: 10px;
            color: #ff88ff;
        }
        #app-dock .dock-add {
            background: rgba(0, 255, 255, 0.06);
            border: 1px dashed rgba(0, 255, 255, 0.15);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.25);
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        #app-dock .dock-add:hover {
            background: rgba(0, 255, 255, 0.12);
            color: #88ffff;
            border-color: #00ffff;
        }

        /* ── APP CANVAS (TABBED VIEW) ── */
        #app-canvas-container {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            width: 92vw;
            max-width: 1100px;
            height: calc(100vh - 160px);
            z-index: 18;
            pointer-events: none;
            display: none;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(2, 2, 8, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.08);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
            transition: opacity 0.3s, transform 0.3s;
        }
        #app-canvas-container.open {
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }
        #app-canvas-container .canvas-header {
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(0, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 44px;
        }
        #app-canvas-container .canvas-header .title {
            font-size: 11px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.6);
        }
        #app-canvas-container .canvas-header .title strong {
            color: #88ffff;
        }
        #app-canvas-container .canvas-header .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #app-canvas-container .canvas-header .actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
            padding: 2px 12px;
            border-radius: 14px;
            font-size: 9px;
            font-family: monospace;
            cursor: pointer;
            transition: 0.2s;
        }
        #app-canvas-container .canvas-header .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        #app-canvas-container .canvas-body {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #030308;
        }
        #app-canvas-container .canvas-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #030308;
        }
        #app-canvas-container .canvas-body .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.08);
            font-family: monospace;
            font-size: 14px;
            flex-direction: column;
            gap: 8px;
        }
        #app-canvas-container .canvas-body .placeholder .big {
            font-size: 40px;
            opacity: 0.15;
        }

        /* ── NODE STUDIO MODAL ── */
        #node-studio-modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(2, 2, 10, 0.92);
            backdrop-filter: blur(24px);
            display: none;
            flex-direction: column;
            padding: 16px;
        }
        #node-studio-modal.open {
            display: flex;
        }
        #node-studio-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 16px 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }
        #node-studio-modal .modal-header h2 {
            font-size: 16px;
            color: #88ffff;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.1em;
        }
        #node-studio-modal .modal-header .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        #node-studio-modal .modal-header .actions button {
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-family: monospace;
            border: 1px solid rgba(0, 255, 255, 0.15);
            background: rgba(0, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: 0.2s;
        }
        #node-studio-modal .modal-header .actions button:hover {
            background: rgba(0, 255, 255, 0.12);
            color: #fff;
        }
        #node-studio-modal .modal-header .actions button.primary {
            background: rgba(255, 0, 255, 0.08);
            border-color: rgba(255, 0, 255, 0.2);
            color: #ff88ff;
        }
        #node-studio-modal .modal-header .actions button.primary:hover {
            background: rgba(255, 0, 255, 0.18);
        }

        #node-canvas {
            flex: 1;
            position: relative;
            background: #05050f;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.06);
            overflow: hidden;
            cursor: grab;
            min-height: 300px;
        }
        #node-canvas:active {
            cursor: grabbing;
        }

        .draggable-node {
            position: absolute;
            cursor: move;
            user-select: none;
            background: rgba(12, 16, 32, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 8px;
            min-width: 110px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: box-shadow 0.2s;
            touch-action: none;
        }
        .draggable-node:hover {
            box-shadow: 0 4px 30px rgba(0, 255, 255, 0.08);
            border-color: rgba(0, 255, 255, 0.3);
        }
        .draggable-node .node-title {
            font-size: 10px;
            font-weight: 700;
            color: #88ffff;
            font-family: monospace;
        }
        .draggable-node .node-sub {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.3);
            font-family: monospace;
            margin-top: 2px;
        }
        .draggable-node .node-tag {
            font-size: 7px;
            background: rgba(255, 0, 255, 0.08);
            padding: 1px 8px;
            border-radius: 10px;
            color: #ff88ff;
            display: inline-block;
            margin-top: 4px;
        }
        .draggable-node .node-connector {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            cursor: crosshair;
        }
        .draggable-node .node-connector:hover {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            #repo-sidebar {
                left: 6px;
                top: 68px;
                bottom: 80px;
                width: 180px;
            }
            #repo-sidebar.collapsed {
                transform: translateX(-200px);
            }
            #top-hud {
                padding: 4px 12px;
                gap: 6px;
                top: 8px;
                border-radius: 28px;
                max-width: 94vw;
            }
            #top-hud .brand {
                font-size: 11px;
            }
            #top-hud .hud-stat {
                font-size: 7px;
            }
            #top-hud .hud-btn {
                font-size: 7px;
                padding: 2px 8px;
            }
            #toggle-sidebar {
                left: 6px;
                top: 8px;
                padding: 4px 8px;
                font-size: 14px;
            }
            #app-dock {
                bottom: 10px;
                padding: 4px 10px;
                gap: 4px;
                border-radius: 28px;
                max-width: 96vw;
            }
            .dock-tab {
                font-size: 7px;
                padding: 3px 10px 3px 8px;
            }
            .dock-tab .tab-label {
                max-width: 50px;
            }
            #app-canvas-container {
                top: 60px;
                width: 96vw;
                height: calc(100vh - 120px);
                border-radius: 10px;
            }
            #app-canvas-container .canvas-header .title {
                font-size: 9px;
            }
            #app-canvas-container .canvas-header .actions button {
                font-size: 7px;
                padding: 1px 8px;
            }
            #node-studio-modal {
                padding: 8px;
            }
            #node-studio-modal .modal-header h2 {
                font-size: 12px;
            }
            .draggable-node {
                padding: 6px 10px;
                min-width: 80px;
            }
            .draggable-node .node-title {
                font-size: 8px;
            }
            .draggable-node .node-sub {
                font-size: 7px;
            }
        }
        @media (max-width: 480px) {
            #repo-sidebar {
                width: 150px;
                left: 4px;
                top: 58px;
                bottom: 72px;
            }
            #repo-sidebar.collapsed {
                transform: translateX(-170px);
            }
            .repo-item {
                font-size: 9px;
                padding: 4px 6px;
            }
            .repo-item .repo-name {
                font-size: 8px;
            }

    <!-- ─── THREE.JS MODULE ─── -->
    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Lights
        const ambient = new THREE.AmbientLight(0x446688, 0.6);
        scene.add(ambient);
        const key = new THREE.DirectionalLight(0x88ffff, 1.8);
        key.position.set(5, 10, 7);
        scene.add(key);
        const fill = new THREE.DirectionalLight(0xff66ff, 0.8);
        fill.position.set(-5, 0, 5);
        scene.add(fill);
        const rim = new THREE.DirectionalLight(0xaa66ff, 0.6);
        rim.position.set(0, -5, -8);
        scene.add(rim);

        // Helix Group
        const helixGroup = new THREE.Group();
        scene.add(helixGroup);

        // Particles background
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 800;
        const pos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i++) {
            pos[i] = (Math.random() - 0.5) * 60;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x446688,
            size: 0.04,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending,
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // ── Build 42 Repositories Helix ──
        const repoCount = 42;
        const repoMeshes = [];
        const colors = [0xff44ff, 0x44ffff, 0xaa66ff]; // pink, blue, purple

        for (let i = 0; i < repoCount; i++) {
            const theta = i * 0.35;
            const y = (i - repoCount / 2) * 0.55;
            const radius = 3.2 + Math.sin(i * 0.15) * 0.4;

            const x1 = Math.cos(theta) * radius;
            const z1 = Math.sin(theta) * radius;

            const colorIdx = i % 3;
            const color = colors[colorIdx];

            const geo = new THREE.SphereGeometry(0.22 + (i % 3) * 0.04, 18, 18);
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.35 + (i % 3) * 0.08,
                roughness: 0.2,
                metalness: 0.6,
            });
            const sphere = new THREE.Mesh(geo, mat);
            sphere.position.set(x1, y, z1);
            sphere.userData = {
                index: i,
                color: color,
                colorName: ['pink', 'blue', 'purple'][colorIdx],
                label: `repo-${i + 1}`
            };
            helixGroup.add(sphere);
            repoMeshes.push(sphere);

            // Small ring around each
            const ringGeo = new THREE.TorusGeometry(0.32 + (i % 3) * 0.04, 0.015, 8, 20);
            const ringMat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.15,
                transparent: true,
                opacity: 0.3,
                wireframe: false,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(sphere.position);
            ring.rotation.x = Math.PI / 2 + i * 0.1;
            ring.rotation.z = i * 0.08;
            helixGroup.add(ring);
        }

        // Glow core
        const coreGeo = new THREE.SphereGeometry(0.6, 24, 24);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0x8844ff,
            emissive: 0x8844ff,
            emissiveIntensity: 0.6,
            transparent: true,
            opacity: 0.2,
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        core.position.set(0, 0, 0);
        helixGroup.add(core);

        // Floating rings
        for (let r = 0; r < 3; r++) {
            const ringGeo = new THREE.TorusGeometry(2.8 + r * 1.2, 0.015, 12, 40);
            const ringMat = new THREE.MeshStandardMaterial({
                color: [0xff44ff, 0x44ffff, 0xaa66ff][r],
                emissive: [0xff44ff, 0x44ffff, 0xaa66ff][r],
                emissiveIntensity: 0.1,
                transparent: true,
                opacity: 0.15,
                wireframe: false,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 3 + r * 0.4;
            ring.rotation.z = r * 0.5;
            helixGroup.add(ring);
        }

        camera.position.set(0, 1, 14);
        camera.lookAt(0, 0, 0);

        // ── Scroll / Mouse Control ──
        let targetRotationY = 0;
        let targetRotationX = 0;
        let currentRotationY = 0;
        let currentRotationX = 0;
        let isDragging = false;
        let prevMouseX = 0;
        let prevMouseY = 0;
        let autoRotate = true;

        // Touch / mouse drag for camera orbit
        const canvas = renderer.domElement;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
            autoRotate = false;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - prevMouseX;
            const dy = e.clientY - prevMouseY;
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            targetRotationX = Math.max(-1.2, Math.min(1.2, targetRotationX));
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
        });
        window.addEventListener('mouseup', () => {
            isDragging = false;
            setTimeout(() => { autoRotate = true; }, 2000);
        });

        // Touch
        let touchId = null;
        canvas.addEventListener('touchstart', (e) => {
            const t = e.changedTouches[0];
            if (t) {
                isDragging = true;
                prevMouseX = t.clientX;
                prevMouseY = t.clientY;
                autoRotate = false;
                touchId = t.identifier;
            }
        }, { passive: true });
        canvas.addEventListener('touchmove', (e) => {
            const t = Array.from(e.changedTouches).find(tc => tc.identifier === touchId);
            if (!t) return;
            const dx = t.clientX - prevMouseX;
            const dy = t.clientY - prevMouseY;
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            targetRotationX = Math.max(-1.2, Math.min(1.2, targetRotationX));
            prevMouseX = t.clientX;
            prevMouseY = t.clientY;
        }, { passive: true });
        canvas.addEventListener('touchend', () => {
            isDragging = false;
            touchId = null;
            setTimeout(() => { autoRotate = true; }, 2000);
        }, { passive: true });

        // Scroll wheel → zoom
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoom = e.deltaY * 0.005;
            camera.position.z = Math.max(6, Math.min(22, camera.position.z + zoom));
        }, { passive: false });

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ── Animation Loop ──
        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate) {
                targetRotationY += 0.002;
            }

            currentRotationY += (targetRotationY - currentRotationY) * 0.06;
            currentRotationX += (targetRotationX - currentRotationX) * 0.06;

            helixGroup.rotation.y = currentRotationY;
            helixGroup.rotation.x = currentRotationX * 0.3;

            // Float particles
            particles.rotation.y += 0.0003;
            particles.rotation.x += 0.0001;

            // Core pulse
            core.scale.setScalar(1 + Math.sin(Date.now() * 0.001) * 0.04);

            renderer.render(scene, camera);
        }
        animate();

        // ── expose for other scripts ──
        window.__helixScene = { scene, camera, renderer, helixGroup };
    </script>

    <!-- ─── APPLICATION LOGIC ─── -->
    <script>
        // ── Repository Data ──
        const REPOS = [];
        const HTML_FILES = [
            'https://worldpeacebtn.github.io/GAme/inDExStory.html',
            'https://worldpeacebtn.github.io/-/RENEW.html',
            'https://worldpeacebtn.github.io/GAme/index.html',
            'https://worldpeacebtn.github.io/-/LIBRA.html',
            'https://worldpeacebtn.github.io/GAme/apex.html',
            'https://worldpeacebtn.github.io/GAme/editor.html',
            'https://worldpeacebtn.github.io/GAme/theater.html',
            'https://worldpeacebtn.github.io/GAme/gallery.html',
            'https://worldpeacebtn.github.io/-/guide.html',
            'https://worldpeacebtn.github.io/GAme/helix.html'
        ];
        const REPO_NAMES = [
            'GAme · Cyber Helix', 'LIBRA · Library', 'GAme · Index',
            'LIBRA · Main', 'APEX · Arena', 'Editor · Studio',
            'Theater · Neon', 'Gallery · Circulate', 'Guide · Lore', 'Helix · Core'
        ];

        for (let i = 0; i < 42; i++) {
            const idx = i % REPO_NAMES.length;
            REPOS.push({
                id: i + 1,
                name: REPO_NAMES[idx] || `repo-${i + 1}`,
                html: HTML_FILES[i % HTML_FILES.length] || `https://worldpeacebtn.github.io/repo-${i + 1}/index.html`,
                starred: false,
                color: ['pink', 'blue', 'purple'][i % 3],
                dotClass: ['pink', 'blue', 'purple'][i % 3],
            });
        }

        // ── State ──
        let activeAppIds = []; // repo ids
        let focusedRepoId = 1;
        let isSidebarOpen = true;
        let nodeConnections = [];

        // ── DOM refs ──
        const repoContainer = document.getElementById('repo-list-container');
        const dockEl = document.getElementById('app-dock');
        const activeCountEl = document.getElementById('active-count');
        const starCountEl = document.getElementById('star-count');
        const focusLabel = document.getElementById('focus-label');
        const canvasContainer = document.getElementById('app-canvas-container');
        const canvasIframe = document.getElementById('canvas-iframe');
        const canvasPlaceholder = document.getElementById('canvas-placeholder');
        const canvasRepoName = document.getElementById('canvas-repo-name');
        const canvasHtmlName = document.getElementById('canvas-html-name');
        const canvasTitle = document.getElementById('canvas-title');
        const toastEl = document.getElementById('toast');

        // ── Render Repositories ──
        function renderRepos() {
            repoContainer.innerHTML = '';
            REPOS.forEach(repo => {
                const div = document.createElement('div');
                div.className = 'repo-item';
                div.dataset.id = repo.id;
                const dot = document.createElement('span');
                dot.className = `dot ${repo.dotClass}`;
                const nameSpan = document.createElement('span');
                nameSpan.className = 'repo-name';
                nameSpan.textContent = repo.name;
                const starBtn = document.createElement('button');
                starBtn.className = `star-btn ${repo.starred ? 'starred' : ''}`;
                starBtn.textContent = '★';
                starBtn.onclick = (e) => { e.stopPropagation();
                    toggleStar(repo.id); };
                const badge = document.createElement('span');
                badge.className = 'html-badge';
                badge.textContent = '.html';
                badge.onclick = (e) => { e.stopPropagation();
                    launchApp(repo.id); };

                div.appendChild(dot);
                div.appendChild(nameSpan);
                div.appendChild(badge);
                div.appendChild(starBtn);

                div.onclick = () => focusRepo(repo.id);
                if (repo.id === focusedRepoId) {
                    div.style.borderColor = 'rgba(0,255,255,0.3)';
                    div.style.background = 'rgba(0,255,255,0.05)';
                }
                repoContainer.appendChild(div);
            });
            updateStarCount();
        }

        // ── Focus Repo ──
        function focusRepo(id) {
            focusedRepoId = id;
            const repo = REPOS.find(r => r.id === id);
            if (repo) {
                focusLabel.textContent = `🌐 ${repo.name}`;
                // highlight in list
                document.querySelectorAll('.repo-item').forEach(el => {
                    el.style.borderColor = 'rgba(255,255,255,0.04)';
                    el.style.background = 'rgba(0,0,0,0.25)';
                    if (parseInt(el.dataset.id) === id) {
                        el.style.borderColor = 'rgba(0,255,255,0.3)';
                        el.style.background = 'rgba(0,255,255,0.05)';
                    }
                });
                renderRepos(); // re-render to keep consistency
                // re-highlight
                document.querySelectorAll('.repo-item').forEach(el => {
                    if (parseInt(el.dataset.id) === id) {
                        el.style.borderColor = 'rgba(0,255,255,0.3)';
                        el.style.background = 'rgba(0,255,255,0.05)';
                    }
                });
                showToast(`📌 Focus: ${repo.name}`);
            }
        }

        // ── Toggle Star ──
        function toggleStar(id) {
            const repo = REPOS.find(r => r.id === id);
            if (repo) {
                repo.starred = !repo.starred;
                renderRepos();
                updateStarCount();
                showToast(repo.starred ? `⭐ ${repo.name} starred` : `☆ ${repo.name} unstarred`);
            }
        }

        function updateStarCount() {
            const count = REPOS.filter(r => r.starred).length;
            starCountEl.textContent = count;
        }

        // ── Sidebar ──
        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            document.getElementById('repo-sidebar').classList.toggle('collapsed', !isSidebarOpen);
            document.getElementById('toggle-sidebar').querySelector('.badge-count').textContent = isSidebarOpen ? '42' :
            '☰';
        }

        // ── Launch App (open in canvas) ──
        function launchApp(id) {
            const repo = REPOS.find(r => r.id === id);
            if (!repo) return;
            if (activeAppIds.includes(id)) {
                showToast(`⚠️ ${repo.name} already open`);
                return;
            }
            if (activeAppIds.length >= 10) {
                showToast('⚠️ MAX 10 apps open. Close some to conserve energy.');
                return;
            }

            activeAppIds.push(id);
            updateActiveCount();
            renderDock();
            openCanvas(repo);
            showToast(`🚀 Launched: ${repo.name}`);
        }

        // ── Open Canvas ──
        function openCanvas(repo) {
            canvasContainer.classList.add('open');
            canvasRepoName.textContent = repo.name;
            const htmlName = repo.html.split('/').pop() || 'index.html';
            canvasHtmlName.textContent = htmlName;
            canvasIframe.style.display = 'block';
            canvasPlaceholder.style.display = 'none';
            canvasIframe.src = repo.html;
            // fallback if iframe fails
            canvasIframe.onerror = () => {
                canvasIframe.style.display = 'none';
                canvasPlaceholder.style.display = 'flex';
                canvasPlaceholder.innerHTML =
                    `<span class="big">🧬</span><span>⚠️ ${repo.name} · ${htmlName}<br><small style="color:rgba(255,255,255,0.2);">(iframe blocked — simulation active)</small></span>`;
            };
            // also set dock active
            document.querySelectorAll('.dock-tab').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.repoId) === repo.id);
            });
        }

        // ── Close Canvas ──
        function closeCanvas() {
            canvasContainer.classList.remove('open');
            canvasIframe.style.display = 'none';
            canvasPlaceholder.style.display = 'flex';
            canvasPlaceholder.innerHTML =
            `<span class="big">🧬</span><span>select a .html dot to launch</span>`;
            canvasIframe.src = '';
            document.querySelectorAll('.dock-tab').forEach(el => el.classList.remove('active'));
        }

        // ── Close App (from dock) ──
        function closeApp(id) {
            activeAppIds = activeAppIds.filter(aid => aid !== id);
            updateActiveCount();
            renderDock();
            if (activeAppIds.length === 0) {
                closeCanvas();
            } else {
                // switch to last active
                const last = activeAppIds[activeAppIds.length - 1];
                const repo = REPOS.find(r => r.id === last);
                if (repo) openCanvas(repo);
            }
            showToast(`✖ App closed`);
        }

        // ── Render Dock ──
        function renderDock() {
            // Remove all dock tabs except the add button
            const addBtn = dockEl.querySelector('.dock-add');
            dockEl.innerHTML = '';
            activeAppIds.forEach(id => {
                const repo = REPOS.find(r => r.id === id);
                if (!repo) return;
                const tab = document.createElement('div');
                tab.className = `dock-tab ${id === focusedRepoId ? 'active' : ''}`;
                tab.dataset.repoId = id;
                const dot = document.createElement('span');
                dot.className = `tab-dot ${repo.dotClass}`;
                const label = document.createElement('span');
                label.className = 'tab-label';
                label.textContent = repo.name.length > 12 ? repo.name.slice(0, 10) + '…' : repo.name;
                const closeBtn = document.createElement('button');
                closeBtn.className = 'tab-close';
                closeBtn.textContent = '×';
                closeBtn.onclick = (e) => { e.stopPropagation();
                    closeApp(id); };
                tab.appendChild(dot);
                tab.appendChild(label);
                tab.appendChild(closeBtn);
                tab.onclick = () => {
                    const r = REPOS.find(rr => rr.id === id);
                    if (r) { focusRepo(id);
                        openCanvas(r); }
                };
                dockEl.appendChild(tab);
            });
            // Re-add the add button
            const newAdd = document.createElement('div');
            newAdd.className = 'dock-add';
            newAdd.textContent = '+';
            newAdd.onclick = () => openCurrentFocusApp();
            dockEl.appendChild(newAdd);
        }

        // ── Open current focus app ──
        function openCurrentFocusApp() {
            const repo = REPOS.find(r => r.id === focusedRepoId) || REPOS[0];
            if (!repo) return;
            if (activeAppIds.includes(repo.id)) {
                openCanvas(repo);
                return;
            }
            launchApp(repo.id);
        }

        // ── Update active count ──
        function updateActiveCount() {
            activeCountEl.textContent = activeAppIds.length;
        }

        // ── Toast ──
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastEl._timeout);
            toastEl._timeout = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2000);
        }

        // ── Export Session ──
        function exportSession() {
            const data = {
                version: 'helix-v1',
                timestamp: new Date().toISOString(),
                activeApps: activeAppIds,
                favorites: REPOS.filter(r => r.starred).map(r => r.id),
                focusedRepo: focusedRepoId,
                repoState: REPOS.map(r => ({ id: r.id, starred: r.starred })),
                nodeCanvas: document.getElementById('node-canvas').innerHTML,
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `helix_session_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('⬇ Session exported');
        }

        // ── Import Session ──
        function importSession(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.repoState) {
                        data.repoState.forEach(item => {
                            const repo = REPOS.find(r => r.id === item.id);
                            if (repo) repo.starred = item.starred;
                        });
                    }
                    if (data.focusedRepo) {
                        focusRepo(data.focusedRepo);
                    }
                    if (data.activeApps) {
                        // close all current
                        activeAppIds = [];
                        // launch saved
                        data.activeApps.forEach(id => {
                            if (!activeAppIds.includes(id) && activeAppIds.length < 10) {
                                activeAppIds.push(id);
                            }
                        });
                        updateActiveCount();
                        renderDock();
                        if (activeAppIds.length > 0) {
                            const last = activeAppIds[activeAppIds.length - 1];
                            const repo = REPOS.find(r => r.id === last);
                            if (repo) openCanvas(repo);
                        }
                    }
                    if (data.nodeCanvas) {
                        document.getElementById('node-canvas').innerHTML = data.nodeCanvas;
                        // re-bind drag events
                        document.querySelectorAll('.draggable-node').forEach(el => {
                            el.setAttribute('draggable', 'true');
                            el.ondragstart = dragNode;
                        });
                    }
                    renderRepos();
                    showToast('⬆ Session loaded ✓');
                } catch (err) {
                    showToast('⚠️ Invalid session file');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ── Node Studio ──
        function openNodeStudio() {
            document.getElementById('node-studio-modal').classList.add('open');
            showToast('✦ Node Studio opened');
        }

        function closeNodeStudio() {
            document.getElementById('node-studio-modal').classList.remove('open');
        }

        function clearNodeCanvas() {
            const canvas = document.getElementById('node-canvas');
            // keep only the svg overlay
            const svg = canvas.querySelector('#node-svg-connections');
            canvas.innerHTML = '';
            canvas.appendChild(svg);
            showToast('🗑 Canvas cleared');
        }

        // ── Drag & Drop for Nodes ──
        let draggedNode = null;

        function dragNode(e) {
            draggedNode = e.target.closest('.draggable-node');
            if (draggedNode) {
                e.dataTransfer.setData('text/plain', draggedNode.id);
                e.dataTransfer.effectAllowed = 'move';
            }
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function dropNode(e) {
            e.preventDefault();
            const canvas = document.getElementById('node-canvas');
            const rect = canvas.getBoundingClientRect();
            const id = e.dataTransfer.getData('text/plain');
            const node = document.getElementById(id);
            if (node && canvas.contains(node)) {
                const x = e.clientX - rect.left - node.offsetWidth / 2;
                const y = e.clientY - rect.top - node.offsetHeight / 2;
                node.style.left = Math.max(0, x) + 'px';
                node.style.top = Math.max(0, y) + 'px';
                showToast('📍 Node moved');
            }
        }

        // ── Connect nodes (visual only) ──
        function connectNode(e, nodeId) {
            e.stopPropagation();
            const node = document.getElementById(nodeId);
            if (!node) return;
            // draw a simple line from this node to center-ish
            const canvas = document.getElementById('node-canvas');
            const svg = document.getElementById('node-svg-connections');
            const rect = canvas.getBoundingClientRect();
            const nRect = node.getBoundingClientRect();
            const x1 = nRect.left - rect.left + nRect.width / 2;
            const y1 = nRect.top - rect.top + nRect.height / 2;
            const x2 = canvas.clientWidth / 2 + (Math.random() - 0.5) * 100;
            const y2 = canvas.clientHeight / 2 + (Math.random() - 0.5) * 100;
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', 'rgba(0,255,255,0.2)');
            line.setAttribute('stroke-width', '1.5');
            line.setAttribute('stroke-dasharray', '4,4');
            svg.appendChild(line);
            showToast(`🔗 Connected ${nodeId}`);
        }

        // ── Save Node Canvas as HTML ──
        function saveNodeCanvasAsHTML() {
            const canvas = document.getElementById('node-canvas');
            const inner = canvas.innerHTML;
            const style = document.querySelector('style').innerHTML;
            const full = `<!DOCTYPE html>
        <html>
        <head><meta charset="UTF-8"><title>Node Workflow Export</title>
        <style>${style} body{background:#020205;padding:20px;}</style>
        </head>
        <body>
          <h2 style="color:#88ffff;font-family:Orbitron;font-size:18px;margin-bottom:16px;">✦ NODE WORKFLOW</h2>
          <div style="position:relative;width:100%;height:80vh;background:#05050f;border-radius:12px;border:1px solid rgba(0,255,255,0.1);overflow:hidden;">
            ${inner}
          </div>
          <p style="color:rgba(255,255,255,0.2);font-family:monospace;font-size:10px;margin-top:12px;">exported from Helix Office · worldpeacebtn</p>
        </body>
        </html>`;
            const blob = new Blob([full], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `node_workflow_${new Date().toISOString().slice(0,10)}.html`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('⬇ Node workflow exported as HTML');
        }

        // ── Init ──
        function init() {
            renderRepos();
            updateActiveCount();
            renderDock();
            focusRepo(1);
            // close canvas initially
            canvasContainer.classList.remove('open');
            canvasIframe.style.display = 'none';
            canvasPlaceholder.style.display = 'flex';
            canvasPlaceholder.innerHTML = `<span class="big">🧬</span><span>select a .html dot to launch</span>`;

            // Mobile: tap outside canvas to close? We'll keep it manual.
            // Also add touch support for node drag on mobile
            document.querySelectorAll('.draggable-node').forEach(el => {
                el.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    const rect = el.parentElement.getBoundingClientRect();
                    const offsetX = touch.clientX - rect.left - el.offsetWidth / 2;
                    const offsetY = touch.clientY - rect.top - el.offsetHeight / 2;
                    el._dragOffsetX = offsetX;
                    el._dragOffsetY = offsetY;
                    el._isDragging = true;
                }, { passive: true });
                el.addEventListener('touchmove', (e) => {
                    if (!el._isDragging) return;
                    const touch = e.touches[0];
                    const rect = el.parentElement.getBoundingClientRect();
                    const x = touch.clientX - rect.left - el._dragOffsetX;
                    const y = touch.clientY - rect.top - el._dragOffsetY;
                    el.style.left = Math.max(0, x) + 'px';
                    el.style.top = Math.max(0, y) + 'px';
                }, { passive: true });
                el.addEventListener('touchend', () => {
                    el._isDragging = false;
                }, { passive: true });
            });

            showToast('🧬 Helix Office · 42 repositories ready');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
