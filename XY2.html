        // ── Sort Function ──
        function applySort() {
            const sortBy = document.getElementById('sort-options').value;
            if (sortBy === 'name') {
                REPOS.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortBy === 'color') {
                const colorOrder = { pink: 0, blue: 1, purple: 2 };
                REPOS.sort((a, b) => colorOrder[a.color] - colorOrder[b.color]);
            } else {
                REPOS.sort((a, b) => a.id - b.id);
            }
            renderRepos();
            if (window.__helix) {
                window.__helix.buildHelix(REPOS);
                if (focusedRepoId) window.__helix.focusOnRepo(focusedRepoId);
            }
        }

        // ── Render Repositories ──
        function renderRepos() {
            repoContainer.innerHTML = '';
            REPOS.forEach(repo => {
                const div = document.createElement('div');
                div.className = 'repo-item';
                div.dataset.id = repo.id;
                const dot = document.createElement('span');
                dot.className = `dot ${repo.color}`;
                const nameSpan = document.createElement('span');
                nameSpan.className = 'repo-name';
                nameSpan.textContent = repo.name;
                const starBtn = document.createElement('button');
                starBtn.className = `star-btn ${repo.starred ? 'starred' : ''}`;
                starBtn.textContent = '★';
                starBtn.onclick = (e) => { e.stopPropagation();
                    toggleStar(repo.id); };
                const badge = document.createElement('span');
                badge.className = 'html-badge';
                badge.textContent = '.html';
                badge.onclick = (e) => { e.stopPropagation();
                    launchApp(repo.id); };
                div.appendChild(dot);
                div.appendChild(nameSpan);
                div.appendChild(badge);
                div.appendChild(starBtn);
                div.onclick = () => focusRepo(repo.id);
                if (repo.id === focusedRepoId) {
                    div.style.borderColor = 'rgba(0,255,255,0.3)';
                    div.style.background = 'rgba(0,255,255,0.05)';
                }
                repoContainer.appendChild(div);
            });
            updateStarCount();
        }

        // ── Focus Repo ──
        function focusRepo(id) {
            focusedRepoId = id;
            const repo = REPOS.find(r => r.id === id);
            if (repo) {
                focusLabel.textContent = `🌐 ${repo.name}`;
                document.querySelectorAll('.repo-item').forEach(el => {
                    el.style.borderColor = 'rgba(255,255,255,0.04)';
                    el.style.background = 'rgba(0,0,0,0.25)';
                    if (parseInt(el.dataset.id) === id) {
                        el.style.borderColor = 'rgba(0,255,255,0.3)';
                        el.style.background = 'rgba(0,255,255,0.05)';
                    }
                });
                if (window.__helix) {
                    window.__helix.focusOnRepo(id);
                }
                showToast(`📌 Focus: ${repo.name}`);
            }
        }

        // ── Toggle Star ──
        function toggleStar(id) {
            const repo = REPOS.find(r => r.id === id);
            if (repo) {
                repo.starred = !repo.starred;
                renderRepos();
                updateStarCount();
                showToast(repo.starred ? `⭐ ${repo.name} starred` : `☆ ${repo.name} unstarred`);
            }
        }

        function updateStarCount() {
            const count = REPOS.filter(r => r.starred).length;
            starCountEl.textContent = count;
        }

        // ── Sidebar ──
        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            document.getElementById('repo-sidebar').classList.toggle('collapsed', !isSidebarOpen);
            document.getElementById('toggle-sidebar').querySelector('.badge-count').textContent = isSidebarOpen ? REPOS
                .length : '☰';
        }

        // ── Launch App ──
        function launchApp(id) {
            const repo = REPOS.find(r => r.id === id);
            if (!repo) return;
            if (activeAppIds.includes(id)) {
                showToast(`⚠️ ${repo.name} already open`);
                return;
            }
            if (activeAppIds.length >= 10) {
                showToast('⚠️ MAX 10 apps open. Close some to conserve energy.');
                return;
            }
            activeAppIds.push(id);
            updateActiveCount();
            renderDock();
            openCanvas(repo);
            showToast(`🚀 Launched: ${repo.name}`);
        }

        // ── Open Canvas ──
        function openCanvas(repo) {
            canvasContainer.classList.add('open');
            canvasRepoName.textContent = repo.name;
            const htmlName = repo.html.split('/').pop() || 'index.html';
            canvasHtmlName.textContent = htmlName;
            canvasIframe.style.display = 'block';
            canvasPlaceholder.style.display = 'none';
            canvasIframe.src = repo.html;
            canvasIframe.onerror = () => {
                canvasIframe.style.display = 'none';
                canvasPlaceholder.style.display = 'flex';
                canvasPlaceholder.innerHTML =
                    `<span class="big">🧬</span><span>⚠️ ${repo.name} · ${htmlName}<br><small style="color:rgba(255,255,255,0.2);">(iframe blocked — simulation active)</small></span>`;
            };
            document.querySelectorAll('.dock-tab').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.repoId) === repo.id);
            });
        }

        // ── Close Canvas ──
        function closeCanvas() {
            canvasContainer.classList.remove('open');
            canvasIframe.style.display = 'none';
            canvasPlaceholder.style.display = 'flex';
            canvasPlaceholder.innerHTML = `<span class="big">🧬</span><span>select a .html dot to launch</span>`;
            canvasIframe.src = '';
            document.querySelectorAll('.dock-tab').forEach(el => el.classList.remove('active'));
        }

        // ── Close App ──
        function closeApp(id) {
            activeAppIds = activeAppIds.filter(aid => aid !== id);
            updateActiveCount();
            renderDock();
            if (activeAppIds.length === 0) {
                closeCanvas();
            } else {
                const last = activeAppIds[activeAppIds.length - 1];
                const repo = REPOS.find(r => r.id === last);
                if (repo) openCanvas(repo);
            }
            showToast(`✖ App closed`);
        }

        // ── Render Dock ──
        function renderDock() {
            dockEl.innerHTML = '';
            activeAppIds.forEach(id => {
                const repo = REPOS.find(r => r.id === id);
                if (!repo) return;
                const tab = document.createElement('div');
                tab.className = `dock-tab ${id === focusedRepoId ? 'active' : ''}`;
                tab.dataset.repoId = id;
                const dot = document.createElement('span');
                dot.className = `tab-dot ${repo.color}`;
                const label = document.createElement('span');
                label.className = 'tab-label';
                label.textContent = repo.name.length > 12 ? repo.name.slice(0, 10) + '…' : repo.name;
                const closeBtn = document.createElement('button');
                closeBtn.className = 'tab-close';
                closeBtn.textContent = '×';
                closeBtn.onclick = (e) => { e.stopPropagation();
                    closeApp(id); };
                tab.appendChild(dot);
                tab.appendChild(label);
                tab.appendChild(closeBtn);
                tab.onclick = () => {
                    const r = REPOS.find(rr => rr.id === id);
                    if (r) { focusRepo(id);
                        openCanvas(r); }
                };
                dockEl.appendChild(tab);
            });
            const newAdd = document.createElement('div');
            newAdd.className = 'dock-add';
            newAdd.textContent = '+';
            newAdd.onclick = () => openCurrentFocusApp();
            dockEl.appendChild(newAdd);
        }

        // ── Open current focus app ──
        function openCurrentFocusApp() {
            const repo = REPOS.find(r => r.id === focusedRepoId) || REPOS[0];
            if (!repo) return;
            if (activeAppIds.includes(repo.id)) {
                openCanvas(repo);
                return;
            }
            launchApp(repo.id);
        }

        function updateActiveCount() {
            activeCountEl.textContent = activeAppIds.length;
        }

        // ── Toast ──
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastEl._timeout);
            toastEl._timeout = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2000);
        }

        // ── Export / Import Session ──
        function exportSession() {
            const data = {
                version: 'helix-v4',
                timestamp: new Date().toISOString(),
                activeApps: activeAppIds,
                favorites: REPOS.filter(r => r.starred).map(r => r.id),
                focusedRepo: focusedRepoId,
                repoState: REPOS.map(r => ({ id: r.id, starred: r.starred })),
                nodeConnections: nodeConnections,
                canvasNodes: canvasNodes,
                remixItems: remixItems,
                nodeCanvas: document.getElementById('node-canvas').innerHTML,
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `helix_session_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('⬇ Session exported');
        }

        function importSession(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.repoState) {
                        data.repoState.forEach(item => {
                            const repo = REPOS.find(r => r.id === item.id);
                            if (repo) repo.starred = item.starred;
                        });
                    }
                    if (data.focusedRepo) {
                        focusRepo(data.focusedRepo);
                    }
                    if (data.activeApps) {
                        activeAppIds = [];
                        data.activeApps.forEach(id => {
                            if (!activeAppIds.includes(id) && activeAppIds.length < 10) {
                                activeAppIds.push(id);
                            }
                        });
                        updateActiveCount();
                        renderDock();
                        if (activeAppIds.length > 0) {
                            const last = activeAppIds[activeAppIds.length - 1];
                            const repo = REPOS.find(r => r.id === last);
                            if (repo) openCanvas(repo);
                        }
                    }
                    if (data.nodeConnections) {
                        nodeConnections = data.nodeConnections;
                    }
                    if (data.canvasNodes) {
                        canvasNodes = data.canvasNodes;
                    }
                    if (data.remixItems) {
                        remixItems = data.remixItems;
                    }
                    if (data.nodeCanvas) {
                        document.getElementById('node-canvas').innerHTML = data.nodeCanvas;
                        document.querySelectorAll('.draggable-node').forEach(el => {
                            el.setAttribute('draggable', 'true');
                            el.ondragstart = dragNode;
                            const connector = el.querySelector('.node-connector');
                            if (connector) {
                                connector.onclick = (ev) => {
                                    ev.stopPropagation();
                                    handleConnectorClick(ev, el.id);
                                };
                            }
                            const editBtn = el.querySelector('.node-edit-btn');
                            if (editBtn) {
                                editBtn.onclick = (ev) => {
                                    ev.stopPropagation();
                                    openNodeEditor(el.id);
                                };
                            }
                            el.onclick = (ev) => {
                                if (ev.target.classList.contains('node-connector') || ev.target.classList.contains(
                                        'node-edit-btn')) return;
                                handleNodeClick(ev, el.id);
                            };
                        });
                        drawAllConnections();
                    }
                    renderRepos();
                    renderLibrary();
                    showToast('⬆ Session loaded ✓');
                } catch (err) {
                    showToast('⚠️ Invalid session file');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ── Node Studio ──
        function openNodeStudio() {
            document.getElementById('node-studio-modal').classList.add('open');
            renderLibrary();
            if (canvasNodes.length === 0 && document.querySelectorAll('.draggable-node').length === 0) {
                remixItems.forEach((item, i) => {
                    const x = 40 + (i % 4) * 140;
                    const y = 40 + Math.floor(i / 4) * 80;
                    canvasNodes.push({
                        id: item.id,
                        name: item.name,
                        color: item.color,
                        html: item.html,
                        x: x,
                        y: y,
                        description: '',
                        events: '',
                        tags: item.tag || ''
                    });
                });
                renderCanvasNodes();
                drawAllConnections();
            }
            showToast('✦ Node Studio opened');
        }

        function closeNodeStudio() {
            document.getElementById('node-studio-modal').classList.remove('open');
            pathMenu.style.display = 'none';
            closeNodeEditor();
        }

        function clearNodeCanvas() {
            canvasNodes = [];
            nodeConnections = [];
            const canvas = document.getElementById('node-canvas');
            const svg = canvas.querySelector('#node-svg-connections');
            canvas.innerHTML = '';
            canvas.appendChild(svg);
            showToast('🗑 Canvas cleared');
        }

        // ── Render Library ──
        function renderLibrary() {
            libraryList.innerHTML = '';
            REPOS.forEach(repo => {
                const item = document.createElement('div');
                item.className = 'lib-item';
                item.draggable = true;
                item.dataset.repoId = repo.id;
                const dot = document.createElement('span');
                dot.className = 'color-dot';
                dot.style.background = repo.color;
                const nameSpan = document.createElement('span');
                nameSpan.className = 'lib-name';
                nameSpan.textContent = repo.name;
                item.appendChild(dot);
                item.appendChild(nameSpan);
                item.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'library', repoId: repo.id }));
                    e.dataTransfer.effectAllowed = 'copy';
                };
                libraryList.appendChild(item);
            });
        }

        // ── Drop from library ──
        function dropNode(e) {
            e.preventDefault();
            const canvas = document.getElementById('node-canvas');
            const rect = canvas.getBoundingClientRect();
            const raw = e.dataTransfer.getData('text/plain');
            try {
                const data = JSON.parse(raw);
                if (data.type === 'library') {
                    const repo = REPOS.find(r => r.id === data.repoId);
                    if (repo) {
                        const newId = Math.max(...canvasNodes.map(n => n.id), 0) + 1;
                        const x = e.clientX - rect.left - 50;
                        const y = e.clientY - rect.top - 30;
                        canvasNodes.push({
                            id: newId,
                            name: repo.name,
                            color: repo.color,
                            html: repo.html,
                            x: Math.max(0, x),
                            y: Math.max(0, y),
                            description: '',
                            events: '',
                            tags: repo.color
                        });
                        renderCanvasNodes();
                        showToast(`➕ Added ${repo.name} to canvas`);
                    }
                } else {
                    const id = raw;
                    const node = document.getElementById(id);
                    if (node && canvas.contains(node)) {
                        const x = e.clientX - rect.left - node.offsetWidth / 2;
                        const y = e.clientY - rect.top - node.offsetHeight / 2;
                        node.style.left = Math.max(0, x) + 'px';
                        node.style.top = Math.max(0, y) + 'px';
                        const nodeId = parseInt(id.replace('node-', ''));
                        const cn = canvasNodes.find(n => n.id === nodeId);
                        if (cn) { cn.x = Math.max(0, x);
                            cn.y = Math.max(0, y); }
                        showToast('📍 Node moved');
                        setTimeout(drawAllConnections, 50);
                    }
                }
            } catch (err) {
                const id = raw;
                const node = document.getElementById(id);
                if (node && canvas.contains(node)) {
                    const x = e.clientX - rect.left - node.offsetWidth / 2;
                    const y = e.clientY - rect.top - node.offsetHeight / 2;
                    node.style.left = Math.max(0, x) + 'px';
                    node.style.top = Math.max(0, y) + 'px';
                    const nodeId = parseInt(id.replace('node-', ''));
                    const cn = canvasNodes.find(n => n.id === nodeId);
                    if (cn) { cn.x = Math.max(0, x);
                        cn.y = Math.max(0, y); }
                    showToast('📍 Node moved');
                    setTimeout(drawAllConnections, 50);
                }
            }
        }

        // ── Render Canvas Nodes ──
        function renderCanvasNodes() {
            const canvas = document.getElementById('node-canvas');
            const svg = canvas.querySelector('#node-svg-connections');
            canvas.querySelectorAll('.draggable-node').forEach(el => el.remove());
            canvasNodes.forEach(node => {
                const div = document.createElement('div');
                div.className = 'draggable-node';
                div.draggable = true;
                div.ondragstart = dragNode;
                div.id = `node-${node.id}`;
                div.style.left = node.x + 'px';
                div.style.top = node.y + 'px';
                const preview = document.createElement('div');
                preview.className = 'node-preview';
                const previewCanvas = document.createElement('canvas');
                previewCanvas.width = 80;
                previewCanvas.height = 40;
                const ctx = previewCanvas.getContext('2d');
                ctx.fillStyle = '#05050f';
                ctx.fillRect(0, 0, 80, 40);
                ctx.fillStyle = node.color;
                ctx.fillRect(4, 4, 72, 32);
                ctx.fillStyle = '#fff';
                ctx.font = '7px monospace';
                ctx.fillText(node.name.slice(0, 8), 8, 20);
                preview.appendChild(previewCanvas);
                const title = document.createElement('div');
                title.className = 'node-title';
                title.textContent = node.name;
                const sub = document.createElement('div');
                sub.className = 'node-sub';
                sub.textContent = node.html.split('/').pop() || 'index.html';
                const tag = document.createElement('span');
                tag.className = 'node-tag';
                tag.textContent = node.tags || node.color;
                const editBtn = document.createElement('button');
                editBtn.className = 'node-edit-btn';
                editBtn.textContent = '✎';
                editBtn.onclick = (ev) => {
                    ev.stopPropagation();
                    openNodeEditor(div.id);
                };
                const connector = document.createElement('div');
                connector.className = 'node-connector';
                connector.dataset.repoId = node.id;
                connector.onclick = (ev) => {
                    ev.stopPropagation();
                    handleConnectorClick(ev, div.id);
                };
                div.appendChild(preview);
                div.appendChild(title);
                div.appendChild(sub);
                div.appendChild(tag);
                div.appendChild(editBtn);
                div.appendChild(connector);
                div.onclick = (ev) => {
                    if (ev.target.classList.contains('node-connector') || ev.target.classList.contains(
                            'node-edit-btn')) return;
                    handleNodeClick(ev, div.id);
                };
                canvas.appendChild(div);
            });
            drawAllConnections();
        }

        // ── Connection Logic ──
        function handleConnectorClick(event, nodeId) {
            event.stopPropagation();
            const nodeEl = document.getElementById(nodeId);
            if (!nodeEl) return;
            if (connectSourceNodeId === null) {
                connectSourceNodeId = nodeId;
                document.querySelectorAll('.node-connector').forEach(el => {
                    el.classList.remove('active-source', 'active-target');
                });
                const srcConn = nodeEl.querySelector('.node-connector');
                if (srcConn) srcConn.classList.add('active-source');
                showToast(`🔗 Source: ${nodeId} — click another node's dot to connect`);
                return;
            }
            const sourceId = connectSourceNodeId;
            const targetId = nodeId;
            if (sourceId === targetId) {
                connectSourceNodeId = null;
                document.querySelectorAll('.node-connector').forEach(el => {
                    el.classList.remove('active-source', 'active-target');
                });
                showToast('❌ Connection cancelled');
                return;
            }
            if (nodeConnections.some(c => c.sourceId === sourceId && c.targetId === targetId)) {
                showToast('⚠️ Connection already exists');
                connectSourceNodeId = null;
                document.querySelectorAll('.node-connector').forEach(el => {
                    el.classList.remove('active-source', 'active-target');
                });
                return;
            }
            nodeConnections.push({ sourceId, targetId });
            drawAllConnections();
            connectSourceNodeId = null;
            document.querySelectorAll('.node-connector').forEach(el => {
                el.classList.remove('active-source', 'active-target');
            });
            // Trigger connection functionality: launch the target app
            const targetNodeId = parseInt(targetId.replace('node-', ''));
            const targetNode = canvasNodes.find(n => n.id === targetNodeId);
            if (targetNode) {
                const repo = REPOS.find(r => r.name === targetNode.name);
                if (repo) {
                    showToast(`🔗 Connected → Launching ${repo.name}`);
                    if (!activeAppIds.includes(repo.id)) {
                        launchApp(repo.id);
                    } else {
                        openCanvas(repo);
                    }
                }
            }
        }

        function drawAllConnections() {
            const svg = document.getElementById('node-svg-connections');
            svg.innerHTML = '';
            nodeConnections.forEach(conn => {
                const sourceEl = document.getElementById(conn.sourceId);
                const targetEl = document.getElementById(conn.targetId);
                if (!sourceEl || !targetEl) return;
                const canvas = document.getElementById('node-canvas');
                const rect = canvas.getBoundingClientRect();
                const sRect = sourceEl.getBoundingClientRect();
                const tRect = targetEl.getBoundingClientRect();
                const x1 = sRect.left - rect.left + sRect.width / 2;
                const y1 = sRect.top - rect.top + sRect.height / 2;
                const x2 = tRect.left - rect.left + tRect.width / 2;
                const y2 = tRect.top - rect.top + tRect.height / 2;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', 'rgba(0,255,255,0.6)');
                line.setAttribute('stroke-width', '2');
                line.setAttribute('stroke-dasharray', '4,4');
                svg.appendChild(line);
            });
        }

        // ── Node click for path menu ──
        function handleNodeClick(event, nodeId) {
            const incoming = nodeConnections.filter(c => c.targetId === nodeId);
            if (incoming.length > 1) {
                const nodeEl = document.getElementById(nodeId);
                if (!nodeEl) return;
                const rect = nodeEl.getBoundingClientRect();
                const canvasRect = document.getElementById('node-canvas').getBoundingClientRect();
                pathMenu.style.left = (rect.left - canvasRect.left + 10) + 'px';
                pathMenu.style.top = (rect.top - canvasRect.top + 20) + 'px';
                pathMenu.innerHTML = '';
                incoming.forEach(conn => {
                    const srcNode = document.getElementById(conn.sourceId);
                    if (!srcNode) return;
                    const nodeIdNum = parseInt(srcNode.id.replace('node-', ''));
                    const nodeData = canvasNodes.find(n => n.id === nodeIdNum);
                    const item = document.createElement('div');
                    item.className = 'menu-item';
                    item.textContent = `◀ ${nodeData ? nodeData.name : conn.sourceId}`;
                    item.onclick = () => {
                        if (nodeData) {
                            const repo = REPOS.find(r => r.name === nodeData.name);
                            if (repo) {
                                focusRepo(repo.id);
                                if (!activeAppIds.includes(repo.id)) {
                                    launchApp(repo.id);
                                } else {
                                    openCanvas(repo);
                                }
                            } else {
                                showToast(`📌 ${nodeData.name}`);
                            }
                        }
                        pathMenu.style.display = 'none';
                    };
                    pathMenu.appendChild(item);
                });
                const cancelItem = document.createElement('div');
                cancelItem.className = 'menu-item';
                cancelItem.textContent = '✕ cancel';
                cancelItem.style.color = 'rgba(255,100,100,0.6)';
                cancelItem.onclick = () => { pathMenu.style.display = 'none'; };
                pathMenu.appendChild(cancelItem);
                pathMenu.style.display = 'block';
                showToast(`🔀 ${incoming.length} paths available`);
            } else {
                pathMenu.style.display = 'none';
            }
        }

        // ── Timeline Layout ──
        function toggleTimelineLayout() {
            timelineMode = !timelineMode;
            const btn = document.getElementById('timeline-toggle-btn');
            btn.classList.toggle('active', timelineMode);
            if (timelineMode) {
                applyTimelineLayout();
                showToast('⏱ Timeline mode ON');
            } else {
                canvasNodes.forEach(node => {
                    const el = document.getElementById(`node-${node.id}`);
                    if (el) {
                        el.style.left = node.x + 'px';
                        el.style.top = node.y + 'px';
                    }
                });
                showToast('🌀 Freeform mode');
            }
            setTimeout(drawAllConnections, 50);
        }

        function applyTimelineLayout() {
            const nodes = canvasNodes.sort((a, b) => a.name.localeCompare(b.name));
            const canvasWidth = document.getElementById('node-canvas').clientWidth;
            const total = nodes.length;
            const spacing = Math.min(140, (canvasWidth - 80) / total);
            nodes.forEach((node, i) => {
                const el = document.getElementById(`node-${node.id}`);
                if (el) {
                    const x = 40 + i * spacing;
                    const y = 40 + (i % 2) * 120;
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                    node.x = x;
                    node.y = y;
                }
            });
        }

        // ── Node Editor ──
        function openNodeEditor(nodeId) {
            const id = parseInt(nodeId.replace('node-', ''));
            const node = canvasNodes.find(n => n.id === id);
            if (!node) return;
            editingNodeId = id;
            document.getElementById('edit-node-name').value = node.name || '';
            document.getElementById('edit-node-color').value = node.color || 'purple';
            document.getElementById('edit-node-desc').value = node.description || '';
            document.getElementById('edit-node-events').value = node.events || '';
            document.getElementById('edit-node-tags').value = node.tags || '';
            editorPopup.classList.add('open');
        }

        function closeNodeEditor() {
            editorPopup.classList.remove('open');
            editingNodeId = null;
        }

        function saveNodeEditor() {
            if (editingNodeId === null) return;
            const node = canvasNodes.find(n => n.id === editingNodeId);
            if (!node) return;
            node.name = document.getElementById('edit-node-name').value || node.name;
            node.color = document.getElementById('edit-node-color').value || node.color;
            node.description = document.getElementById('edit-node-desc').value || '';
            node.events = document.getElementById('edit-node-events').value || '';
            node.tags = document.getElementById('edit-node-tags').value || '';
            const el = document.getElementById(`node-${node.id}`);
            if (el) {
                el.querySelector('.node-title').textContent = node.name;
                el.querySelector('.node-tag').textContent = node.tags || node.color;
                const previewCanvas = el.querySelector('.node-preview canvas');
                if (previewCanvas) {
                    const ctx = previewCanvas.getContext('2d');
                    ctx.fillStyle = '#05050f';
                    ctx.fillRect(0, 0, 80, 40);
                    ctx.fillStyle = node.color;
                    ctx.fillRect(4, 4, 72, 32);
                    ctx.fillStyle = '#fff';
                    ctx.font = '7px monospace';
                    ctx.fillText(node.name.slice(0, 8), 8, 20);
                }
                const remixItem = remixItems.find(r => r.id === node.id);
                if (remixItem) remixItem.color = node.color;
                const repo = REPOS.find(r => r.name === node.name);
                if (repo) repo.color = node.color;
            }
            closeNodeEditor();
            showToast(`💾 Saved ${node.name}`);
            renderRepos();
            renderLibrary();
            if (window.__helix) {
                window.__helix.buildHelix(REPOS);
                if (focusedRepoId) window.__helix.focusOnRepo(focusedRepoId);
            }
        }

        function deleteNodeFromEditor() {
            if (editingNodeId === null) return;
            const idx = canvasNodes.findIndex(n => n.id === editingNodeId);
            if (idx !== -1) {
                canvasNodes.splice(idx, 1);
                nodeConnections = nodeConnections.filter(c => c.sourceId !== `node-${editingNodeId}` && c.targetId !==
                    `node-${editingNodeId}`);
                closeNodeEditor();
                renderCanvasNodes();
                drawAllConnections();
                showToast('🗑 Node deleted');
            }
        }

        // ── Drag & Drop for nodes ──
        let draggedNode = null;

        function dragNode(e) {
            draggedNode = e.target.closest('.draggable-node');
            if (draggedNode) {
                e.dataTransfer.setData('text/plain', draggedNode.id);
                e.dataTransfer.effectAllowed = 'move';
            }
        }

        function allowDrop(e) { e.preventDefault(); }

        // ── Generate Helix from canvas nodes ──
        function generateHelixFromCanvas() {
            if (canvasNodes.length === 0) {
                showToast('⚠️ No nodes on canvas to generate helix');
                return;
            }
            const newRepos = canvasNodes.map((node, i) => ({
                id: i + 1,
                name: node.name,
                html: node.html || 'https://worldpeacebtn.github.io/',
                color: node.color || 'purple',
                starred: false,
            }));
            REPOS = newRepos;
            renderRepos();
            if (window.__helix) {
                window.__helix.buildHelix(REPOS);
                if (REPOS.length > 0) focusRepo(REPOS[0].id);
            }
            showToast(`🌀 Generated helix from ${canvasNodes.length} nodes`);
        }

        // ── Save Node Canvas as HTML ──
        function saveNodeCanvasAsHTML() {
            const canvas = document.getElementById('node-canvas');
            const inner = canvas.innerHTML;
            const style = document.querySelector('style').innerHTML;
            const full = `<!DOCTYPE html>
        <html>
        <head><meta charset="UTF-8"><title>Node Workflow Export</title>
        <style>${style} body{background:#020205;padding:20px;}</style>
        </head>
        <body>
          <h2 style="color:#88ffff;font-family:Orbitron;font-size:18px;margin-bottom:16px;">✦ NODE WORKFLOW</h2>
          <div style="position:relative;width:100%;height:80vh;background:#05050f;border-radius:12px;border:1px solid rgba(0,255,255,0.1);overflow:hidden;">
            ${inner}
          </div>
          <p style="color:rgba(255,255,255,0.2);font-family:monospace;font-size:10px;margin-top:12px;">exported from Helix Office · worldpeacebtn</p>
        </body>
        </html>`;
            const blob = new Blob([full], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `node_workflow_${new Date().toISOString().slice(0,10)}.html`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('⬇ Node workflow exported as HTML');
        }

        // ── Init ──
        async function init() {
            await fetchRepos();
            updateActiveCount();
            renderDock();
            if (REPOS.length > 0) {
                focusRepo(REPOS[0].id);
            }
            canvasContainer.classList.remove('open');
            canvasIframe.style.display = 'none';
            canvasPlaceholder.style.display = 'flex';
            canvasPlaceholder.innerHTML = `<span class="big">🧬</span><span>select a .html dot to launch</span>`;
            showToast('🧬 Helix Office · Ready');
        }

        // ── Expose ──
        window.REPOS = REPOS;
        window.focusRepo = focusRepo;
        window.toggleStar = toggleStar;
        window.toggleSidebar = toggleSidebar;
        window.launchApp = launchApp;
        window.closeApp = closeApp;
        window.openCurrentFocusApp = openCurrentFocusApp;
        window.exportSession = exportSession;
        window.importSession = importSession;
        window.openNodeStudio = openNodeStudio;
        window.closeNodeStudio = closeNodeStudio;
        window.clearNodeCanvas = clearNodeCanvas;
        window.dragNode = dragNode;
        window.allowDrop = allowDrop;
        window.dropNode = dropNode;
        window.saveNodeCanvasAsHTML = saveNodeCanvasAsHTML;
        window.closeCanvas = closeCanvas;
        window.toggleTimelineLayout = toggleTimelineLayout;
        window.handleConnectorClick = handleConnectorClick;
        window.handleNodeClick = handleNodeClick;
        window.drawAllConnections = drawAllConnections;
        window.generateHelixFromCanvas = generateHelixFromCanvas;
        window.openNodeEditor = openNodeEditor;
        window.closeNodeEditor = closeNodeEditor;
        window.saveNodeEditor = saveNodeEditor;
        window.deleteNodeFromEditor = deleteNodeFromEditor;
        window.renderCanvasNodes = renderCanvasNodes;
        window.renderLibrary = renderLibrary;
        window.applySort = applySort;

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
