<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <title>Helix Office · Gaming Hub</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        /* ── RESET & BASE ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #020205;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }
        .cyber-font {
            font-family: 'Orbitron', sans-serif;
        }

        /* ── 3D CONTAINER ── */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: auto;
        }

        /* ── SCANLINE ── */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 255, 255, 0.08) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.15;
            pointer-events: none;
            z-index: 2;
            animation: scanline 8s linear infinite;
        }
        @keyframes scanline {
            0% {
                top: -100px;
            }
            100% {
                top: 100vh;
            }
        }

        /* ── GLASS PANEL ── */
        .glass-panel {
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 255, 255, 0.20);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.08);
        }
        .glass-panel-dark {
            background: rgba(5, 5, 18, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(0, 255, 255, 0.15);
        }

        /* ── HUD LAYER ── */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        .clickable {
            pointer-events: auto;
        }

        /* ── LEFT SIDEBAR ── */
        #repo-sidebar {
            position: fixed;
            left: 12px;
            top: 80px;
            bottom: 80px;
            width: 220px;
            z-index: 20;
            pointer-events: auto;
            transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            padding: 0;
        }
        #repo-sidebar.collapsed {
            transform: translateX(-240px);
            opacity: 0;
        }
        #repo-sidebar .sidebar-header {
            padding: 12px 14px 8px 14px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.12);
            flex-shrink: 0;
        }
        #repo-sidebar .sidebar-header h3 {
            font-size: 10px;
            letter-spacing: 0.2em;
            color: #f0aaff;
            font-weight: 700;
        }
        #repo-sidebar .sidebar-header .sub {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.35);
            font-family: monospace;
            margin-top: 2px;
        }
        #repo-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #repo-list-container::-webkit-scrollbar {
            width: 3px;
        }
        #repo-list-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        #repo-list-container::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 4px;
        }

        .repo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px 6px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
            font-family: monospace;
        }
        .repo-item:hover {
            background: rgba(0, 255, 255, 0.07);
            border-color: rgba(0, 255, 255, 0.25);
        }
        .repo-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-right: 8px;
            transition: 0.2s;
        }
        .repo-item .dot.pink {
            background: #ff44ff;
            box-shadow: 0 0 8px #ff44ff66;
        }
        .repo-item .dot.blue {
            background: #44ffff;
            box-shadow: 0 0 8px #44ffff66;
        }
        .repo-item .dot.purple {
            background: #aa66ff;
            box-shadow: 0 0 8px #aa66ff66;
        }
        .repo-item .repo-name {
            flex: 1;
            color: rgba(255, 255, 255, 0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 10px;
        }
        .repo-item .star-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            cursor: pointer;
            padding: 0 2px;
            transition: 0.2s;
            line-height: 1;
        }
        .repo-item .star-btn.starred {
            color: #ffdd44;
            text-shadow: 0 0 12px #ffdd4488;
        }
        .repo-item .star-btn:hover {
            transform: scale(1.2);
        }
        .repo-item .html-badge {
            font-size: 7px;
            background: rgba(0, 255, 255, 0.12);
            padding: 1px 6px;
            border-radius: 10px;
            color: #88ffff;
            margin-left: 6px;
            letter-spacing: 0.05em;
            font-weight: 600;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .repo-item .html-badge:hover {
            background: rgba(0, 255, 255, 0.25);
        }
        #sort-options {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 9px;
            font-family: monospace;
            padding: 2px 6px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        #sort-options option {
            background: #05050f;
        }

        /* ── TOGGLE SIDEBAR BTN ── */
        #toggle-sidebar {
            position: fixed;
            left: 12px;
            top: 12px;
            z-index: 25;
            pointer-events: auto;
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 6px 10px;
            color: #88ffff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #toggle-sidebar:hover {
            background: rgba(0, 255, 255, 0.12);
            border-color: #00ffff;
        }
        #toggle-sidebar .badge-count {
            font-size: 9px;
            background: rgba(255, 0, 255, 0.2);
            padding: 1px 8px;
            border-radius: 12px;
            color: #ff88ff;
        }

        /* ── TOP HUD ── */
        #top-hud {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 18px 6px 16px;
            border-radius: 40px;
            background: rgba(10, 15, 30, 0.55);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 255, 255, 0.12);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            justify-content: center;
        }
        #top-hud .brand {
            font-size: 14px;
            font-weight: 900;
            color: #88ffff;
            letter-spacing: 0.1em;
            font-family: 'Orbitron', sans-serif;
            white-space: nowrap;
        }
        #top-hud .brand span {
            color: #ff66ff;
        }
        #top-hud .hud-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.08);
        }
        #top-hud .hud-stat {
            font-size: 9px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        #top-hud .hud-stat strong {
            color: #ff88ff;
            font-weight: 700;
        }
        #top-hud .hud-stat .num {
            color: #88ffff;
            font-weight: 700;
        }
        #top-hud .hud-btn {
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.15);
            color: #88ffff;
            padding: 3px 12px;
            border-radius: 16px;
            font-size: 9px;
            font-family: monospace;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        #top-hud .hud-btn:hover {
            background: rgba(0, 255, 255, 0.18);
            border-color: #00ffff;
        }
        #top-hud .hud-btn.pink {
            background: rgba(255, 0, 255, 0.08);
            border-color: rgba(255, 0, 255, 0.2);
            color: #ff88ff;
        }
        #top-hud .hud-btn.pink:hover {
            background: rgba(255, 0, 255, 0.18);
        }
        #top-hud .hud-btn.view-toggle {
            background: rgba(255, 200, 0, 0.08);
            border-color: rgba(255, 200, 0, 0.2);
            color: #ffdd44;
        }
        #top-hud .hud-btn.view-toggle:hover {
            background: rgba(255, 200, 0, 0.18);
        }
        #top-hud .hud-btn.generate-helix {
            background: rgba(0, 255, 100, 0.08);
            border-color: rgba(0, 255, 100, 0.2);
            color: #88ff88;
        }
        #top-hud .hud-btn.generate-helix:hover {
            background: rgba(0, 255, 100, 0.18);
        }

        /* ── APP DOCK ── */
        #app-dock {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 40px;
            background: rgba(5, 5, 18, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 255, 0.10);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            max-width: 92vw;
            overflow-x: auto;
            flex-wrap: nowrap;
            scrollbar-width: none;
        }
        #app-dock::-webkit-scrollbar {
            display: none;
        }
        .dock-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px 4px 10px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            font-size: 9px;
            font-family: monospace;
            cursor: pointer;
            transition: 0.25s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .dock-tab.active {
            background: rgba(0, 255, 255, 0.10);
            border-color: rgba(0, 255, 255, 0.30);
            color: #88ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.04);
        }
        .dock-tab .tab-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            transition: 0.2s;
        }
        .dock-tab .tab-close:hover {
            color: #ff4477;
        }
        .dock-tab .tab-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .dock-tab .tab-dot.pink {
            background: #ff44ff;
        }
        .dock-tab .tab-dot.blue {
            background: #44ffff;
        }
        .dock-tab .tab-dot.purple {
            background: #aa66ff;
        }
        .dock-tab .tab-label {
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #app-dock .dock-add {
            background: rgba(0, 255, 255, 0.06);
            border: 1px dashed rgba(0, 255, 255, 0.15);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.25);
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        #app-dock .dock-add:hover {
            background: rgba(0, 255, 255, 0.12);
            color: #88ffff;
            border-color: #00ffff;
        }

        /* ── APP CANVAS ── */
        #app-canvas-container {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            width: 92vw;
            max-width: 1100px;
            height: calc(100vh - 160px);
            z-index: 18;
            pointer-events: none;
            display: none;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(2, 2, 8, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.08);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
            transition: opacity 0.3s, transform 0.3s;
        }
        #app-canvas-container.open {
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }
        #app-canvas-container .canvas-header {
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(0, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 44px;
        }
        #app-canvas-container .canvas-header .title {
            font-size: 11px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.6);
        }
        #app-canvas-container .canvas-header .title strong {
            color: #88ffff;
        }
        #app-canvas-container .canvas-header .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #app-canvas-container .canvas-header .actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
            padding: 2px 12px;
            border-radius: 14px;
            font-size: 9px;
            font-family: monospace;
            cursor: pointer;
            transition: 0.2s;
        }
        #app-canvas-container .canvas-header .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        #app-canvas-container .canvas-body {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #030308;
        }
        #app-canvas-container .canvas-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #030308;
        }
        #app-canvas-container .canvas-body .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.08);
            font-family: monospace;
            font-size: 14px;
            flex-direction: column;
            gap: 8px;
        }
        #app-canvas-container .canvas-body .placeholder .big {
            font-size: 40px;
            opacity: 0.15;
        }

        /* ── NODE STUDIO MODAL ── */
        #node-studio-modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(2, 2, 10, 0.92);
            backdrop-filter: blur(24px);
            display: none;
            flex-direction: column;
            padding: 12px;
        }
        #node-studio-modal.open {
            display: flex;
        }
        #node-studio-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 12px 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }
        #node-studio-modal .modal-header h2 {
            font-size: 16px;
            color: #88ffff;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.1em;
        }
        #node-studio-modal .modal-header .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        #node-studio-modal .modal-header .actions button {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-family: monospace;
            border: 1px solid rgba(0, 255, 255, 0.15);
            background: rgba(0, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: 0.2s;
        }
        #node-studio-modal .modal-header .actions button:hover {
            background: rgba(0, 255, 255, 0.12);
            color: #fff;
        }
        #node-studio-modal .modal-header .actions button.primary {
            background: rgba(255, 0, 255, 0.08);
            border-color: rgba(255, 0, 255, 0.2);
            color: #ff88ff;
        }
        #node-studio-modal .modal-header .actions button.primary:hover {
            background: rgba(255, 0, 255, 0.18);
        }
        #node-studio-modal .modal-header .actions button.timeline-toggle {
            background: rgba(0, 255, 255, 0.08);
            border-color: rgba(0, 255, 255, 0.2);
            color: #88ffff;
        }
        #node-studio-modal .modal-header .actions button.timeline-toggle.active {
            background: rgba(255, 0, 255, 0.15);
            border-color: #ff44ff;
            color: #ff88ff;
        }
        #node-studio-modal .modal-header .actions button.generate-helix {
            background: rgba(0, 255, 100, 0.08);
            border-color: rgba(0, 255, 100, 0.2);
            color: #88ff88;
        }
        #node-studio-modal .modal-header .actions button.generate-helix:hover {
            background: rgba(0, 255, 100, 0.18);
        }

        .studio-body {
            flex: 1;
            display: flex;
            gap: 8px;
            min-height: 0;
        }
        .studio-library {
            width: 180px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .studio-library .lib-title {
            font-size: 8px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.1em;
            font-family: monospace;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 4px;
            margin-bottom: 4px;
        }
        .studio-library .lib-item {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            font-size: 9px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.5);
            cursor: grab;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .studio-library .lib-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .studio-library .lib-item .color-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .studio-library .lib-item .lib-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #node-canvas {
            flex: 1;
            position: relative;
            background: #05050f;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.06);
            overflow: hidden;
            cursor: grab;
            min-height: 200px;
            touch-action: none;
        }
        #node-canvas:active {
            cursor: grabbing;
        }

        .draggable-node {
            position: absolute;
            cursor: move;
            user-select: none;
            background: rgba(12, 16, 32, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.15);
            padding: 8px 10px;
            border-radius: 8px;
            min-width: 100px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: box-shadow 0.2s, border-color 0.2s;
            touch-action: none;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .draggable-node:hover {
            box-shadow: 0 4px 30px rgba(0, 255, 255, 0.08);
            border-color: rgba(0, 255, 255, 0.3);
        }
        .draggable-node .node-preview {
            width: 100%;
            height: 40px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
            position: relative;
        }
        .draggable-node .node-preview canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .draggable-node .node-title {
            font-size: 9px;
            font-weight: 700;
            color: #88ffff;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .draggable-node .node-sub {
            font-size: 7px;
            color: rgba(255, 255, 255, 0.3);
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .draggable-node .node-tag {
            font-size: 6px;
            background: rgba(255, 0, 255, 0.08);
            padding: 1px 6px;
            border-radius: 8px;
            color: #ff88ff;
            display: inline-block;
            align-self: flex-start;
        }
        .draggable-node .node-connector {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;

    <!-- ─── THREE.JS MODULE ─── -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Lights
        const ambient = new THREE.AmbientLight(0x446688, 0.6);
        scene.add(ambient);
        const key = new THREE.DirectionalLight(0x88ffff, 1.8);
        key.position.set(5, 10, 7);
        scene.add(key);
        const fill = new THREE.DirectionalLight(0xff66ff, 0.8);
        fill.position.set(-5, 0, 5);
        scene.add(fill);
        const rim = new THREE.DirectionalLight(0xaa66ff, 0.6);
        rim.position.set(0, -5, -8);
        scene.add(rim);

        // Helix Group
        const helixGroup = new THREE.Group();
        scene.add(helixGroup);

        // Particles with gravity feel
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 1200;
        const pos = new Float32Array(particleCount * 3);
        const velocities = [];
        for (let i = 0; i < particleCount * 3; i++) {
            pos[i] = (Math.random() - 0.5) * 80;
            if (i % 3 === 2) velocities.push((Math.random() - 0.5) * 0.01);
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x446688,
            size: 0.06,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // Core sphere
        const coreGeo = new THREE.SphereGeometry(0.5, 24, 24);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0x8844ff,
            emissive: 0x8844ff,
            emissiveIntensity: 0.8,
            transparent: true,
            opacity: 0.9,
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        core.position.set(0, 0, 0);
        helixGroup.add(core);

        const glowGeo = new THREE.SphereGeometry(0.7, 24, 24);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x8844ff,
            transparent: true,
            opacity: 0.2,
            blending: THREE.AdditiveBlending,
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.set(0, 0, 0);
        helixGroup.add(glow);

        // ── Rings & Grid ──
        let ringObjects = [];
        let gridHelper = null;

        function buildRings() {
            ringObjects.forEach(r => helixGroup.remove(r));
            ringObjects = [];
            for (let r = 0; r < 3; r++) {
                const ringGeo = new THREE.TorusGeometry(2.8 + r * 1.2, 0.015, 12, 40);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: [0xff44ff, 0x44ffff, 0xaa66ff][r],
                    emissive: [0xff44ff, 0x44ffff, 0xaa66ff][r],
                    emissiveIntensity: 0.15,
                    transparent: true,
                    opacity: 0.3,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 3 + r * 0.4;
                ring.rotation.z = r * 0.5;
                ring.userData.isRing = true;
                helixGroup.add(ring);
                ringObjects.push(ring);
            }
        }

        function buildGrid() {
            if (gridHelper) scene.remove(gridHelper);
            gridHelper = new THREE.GridHelper(30, 30, 0x8844ff, 0x446688);
            gridHelper.material.transparent = true;
            gridHelper.material.opacity = 0.15;
            gridHelper.position.y = -5;
            scene.add(gridHelper);
        }

        buildRings();
        buildGrid();

        // ── Generate Sphere Preview Texture ──
        function createSphereTexture(repo) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            // Background
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, '#0a0a1a');
            grad.addColorStop(1, '#020205');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);

            // Border Glow
            const colorMap = { pink: '#ff44ff', blue: '#44ffff', purple: '#aa66ff' };
            const mainColor = colorMap[repo.color] || '#888888';
            ctx.shadowColor = mainColor;
            ctx.shadowBlur = 20;
            ctx.strokeStyle = mainColor;
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, 108, 108);
            ctx.shadowBlur = 0;

            // Name
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Orbitron, monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(repo.name.slice(0, 8), 64, 50);

            // Status
            ctx.fillStyle = mainColor;
            ctx.font = '10px monospace';
            ctx.fillText('● ONLINE', 64, 80);

            // Icon
            ctx.font = '24px sans-serif';
            ctx.fillText('🧬', 64, 110);

            // Small dots
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const x = 64 + Math.cos(angle) * 50;
                const y = 64 + Math.sin(angle) * 50;
                ctx.fillStyle = mainColor;
                ctx.shadowBlur = 10;
                ctx.shadowColor = mainColor;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // ── Build Helix ──
        function buildHelix(repos, viewMode = currentView) {
            while (helixGroup.children.length > 0) {
                const child = helixGroup.children[0];
                if (child.userData.isRing) {
                    // Keep rings separate? We'll rebuild them later.
                }
                helixGroup.remove(child);
            }
            // Re-add core, glow, and rings
            helixGroup.add(core);
            helixGroup.add(glow);
            ringObjects.forEach(r => helixGroup.add(r));

            repoMeshes.length = 0;

            const count = repos.length;
            const colors = {
                pink: 0xff44ff,
                blue: 0x44ffff,
                purple: 0xaa66ff
            };

            repos.forEach((repo, i) => {
                let x, y, z;
                const radius = 3.2 + Math.sin(i * 0.15) * 0.4;
                if (viewMode === 'sonar') {
                    const angle = i * 0.8;
                    const ring = Math.floor(i / 8) + 1;
                    const r = 1.5 + ring * 1.2;
                    x = Math.cos(angle) * r;
                    z = Math.sin(angle) * r;
                    y = 0;
                } else {
                    const theta = i * 0.35;
                    y = (i - count / 2) * 0.55;
                    x = Math.cos(theta) * radius;
                    z = Math.sin(theta) * radius;
                }

                const colorHex = colors[repo.color] || 0x888888;
                const texture = createSphereTexture(repo);

                const geo = new THREE.SphereGeometry(0.28, 24, 24);
                const mat = new THREE.MeshStandardMaterial({
                    map: texture,
                    color: 0xffffff,
                    emissive: colorHex,
                    emissiveIntensity: 0.15,
                    roughness: 0.3,
                    metalness: 0.6,
                });
                const sphere = new THREE.Mesh(geo, mat);
                sphere.position.set(x, y, z);
                sphere.userData = {
                    repoId: repo.id,
                    color: repo.color,
                    label: repo.name,
                    html: repo.html,
                    originalPos: new THREE.Vector3(x, y, z)
                };
                helixGroup.add(sphere);
                repoMeshes.push(sphere);

                // Ring around sphere
                const ringGeo = new THREE.TorusGeometry(0.32, 0.015, 8, 20);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: colorHex,
                    emissive: colorHex,
                    emissiveIntensity: 0.2,
                    transparent: true,
                    opacity: 0.5,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.copy(sphere.position);
                ring.rotation.x = Math.PI / 2 + i * 0.1;
                ring.rotation.z = i * 0.08;
                helixGroup.add(ring);
            });

            updateCameraView(viewMode);
        }

        let currentView = 'helix';
        let repoMeshes = [];
        let beamLine = null;
        let targetCameraPos = new THREE.Vector3(0, 1, 14);
        let targetLookAt = new THREE.Vector3(0, 0, 0);

        // ── Camera Helpers ──
        function updateCameraView(mode) {
            if (mode === 'sonar') {
                targetCameraPos.set(0, 12, 0.01);
                targetLookAt.set(0, 0, 0);
            } else {
                targetCameraPos.set(0, 1, 14);
                targetLookAt.set(0, 0, 0);
            }
            window.cameraTarget = targetLookAt;
            window.cameraPosition = targetCameraPos;
        }

        // ── Toggle view ──
        window.toggleView = function() {
            currentView = (currentView === 'helix') ? 'sonar' : 'helix';
            document.getElementById('view-toggle-btn').textContent = currentView === 'helix' ? '🔭 HELIX' : '📡 SONAR';
            const repos = window.REPOS || [];
            buildHelix(repos, currentView);
            if (window.focusedRepoId) {
                focusOnRepo(window.focusedRepoId);
            }
            showToast(`View: ${currentView.toUpperCase()}`);
        };

        // ── Focus on repo ──
        function focusOnRepo(repoId) {
            const mesh = repoMeshes.find(m => m.userData.repoId === repoId);
            if (!mesh) return;
            const targetPos = mesh.position.clone();
            const offset = new THREE.Vector3(1.5, 0.5, 2.5);
            const worldPos = targetPos.clone().add(offset);
            window.cameraTarget = targetPos;
            window.cameraPosition = worldPos;
            if (beamLine) {
                helixGroup.remove(beamLine);
                beamLine = null;
            }
            const points = [
                new THREE.Vector3(0, 0, 0),
                targetPos.clone()
            ];
            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.02, 8, false);
            const tubeMat = new THREE.MeshBasicMaterial({
                color: 0x8844ff,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending,
            });
            beamLine = new THREE.Mesh(tubeGeo, tubeMat);
            helixGroup.add(beamLine);
        }

        // ── Reset Camera ──
        window.resetCamera = function() {
            window.cameraTarget = new THREE.Vector3(0, 0, 0);
            window.cameraPosition = new THREE.Vector3(0, 1, 14);
            controls.target.set(0, 0, 0);
            showToast('⟲ Centered');
        };

        // ── Toggle Rings ──
        window.toggleRings = function() {
            const btn = document.getElementById('toggle-rings');
            const visible = ringObjects.some(r => r.visible);
            ringObjects.forEach(r => r.visible = !visible);
            btn.classList.toggle('active');
            showToast(visible ? '⭕ Rings hidden' : '⭕ Rings shown');
        };

        // ── Toggle Grid ──
        window.toggleGrid = function() {
            const btn = document.getElementById('toggle-grid');
            gridHelper.visible = !gridHelper.visible;
            btn.classList.toggle('active');
            showToast(gridHelper.visible ? '⊞ Grid shown' : '⊞ Grid hidden');
        };

        // ── Controls ──
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;
        controls.enableZoom = true;
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2;
        controls.minDistance = 3;
        controls.maxDistance = 25;

        // ── Joystick Logic ──
        let leftJoystickActive = false;
        let rightJoystickActive = false;
        let leftTouchId = null;
        let rightTouchId = null;

        const leftJoystick = document.getElementById('joystick-left');
        const rightJoystick = document.getElementById('joystick-right');
        const leftKnob = document.getElementById('left-knob');
        const rightKnob = document.getElementById('right-knob');

        function handleJoystickStart(e, isLeft) {
            const touch = e.changedTouches[0];
            if (!touch) return;
            const el = isLeft ? leftJoystick : rightJoystick;
            const rect = el.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = touch.clientX - centerX;
            const dy = touch.clientY - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = rect.width / 2 - 10;
            const clampedDist = Math.min(dist, maxDist);
            const angle = Math.atan2(dy, dx);

            const knob = isLeft ? leftKnob : rightKnob;
            knob.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;

            const normX = (Math.cos(angle) * clampedDist) / maxDist;
            const normY = (Math.sin(angle) * clampedDist) / maxDist;

            if (isLeft) {
                controls.autoRotate = false;
                const rotSpeed = 0.02;
                controls.target.x += normX * rotSpeed;
                controls.target.z += normY * rotSpeed;
            } else {
                const zoomSpeed = 0.1;
                camera.position.z += normY * zoomSpeed;
                camera.position.z = Math.max(3, Math.min(25, camera.position.z));
                camera.position.x += normX * zoomSpeed * 0.5;
                camera.position.x = Math.max(-15, Math.min(15, camera.position.x));
            }

            if (isLeft) {
                leftJoystickActive = true;
                leftTouchId = touch.identifier;
            } else {
                rightJoystickActive = true;
                rightTouchId = touch.identifier;
            }
            e.preventDefault();
        }

        function handleJoystickMove(e, isLeft) {
            const touch = Array.from(e.changedTouches).find(t => t.identifier === (isLeft ? leftTouchId : rightTouchId));
            if (!touch) return;
            const el = isLeft ? leftJoystick : rightJoystick;
            const rect = el.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = touch.clientX - centerX;
            const dy = touch.clientY - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = rect.width / 2 - 10;
            const clampedDist = Math.min(dist, maxDist);
            const angle = Math.atan2(dy, dx);

            const knob = isLeft ? leftKnob : rightKnob;
            knob.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;

            const normX = (Math.cos(angle) * clampedDist) / maxDist;
            const normY = (Math.sin(angle) * clampedDist) / maxDist;

            if (isLeft) {
                controls.autoRotate = false;
                const rotSpeed = 0.02;
                controls.target.x += normX * rotSpeed;
                controls.target.z += normY * rotSpeed;
            } else {
                const zoomSpeed = 0.1;
                camera.position.z += normY * zoomSpeed;
                camera.position.z = Math.max(3, Math.min(25, camera.position.z));
                camera.position.x += normX * zoomSpeed * 0.5;
                camera.position.x = Math.max(-15, Math.min(15, camera.position.x));
            }
            e.preventDefault();
        }

        function handleJoystickEnd(e, isLeft) {
            const knob = isLeft ? leftKnob : rightKnob;
            knob.style.transform = 'translate(0px, 0px)';
            if (isLeft) {
                leftJoystickActive = false;
                leftTouchId = null;
                // Re-enable auto-rotate after a moment
                setTimeout(() => { if (!leftJoystickActive) controls.autoRotate = true; }, 2000);
            } else {
                rightJoystickActive = false;
                rightTouchId = null;
            }
            e.preventDefault();
        }

        leftJoystick.addEventListener('touchstart', (e) => handleJoystickStart(e, true));
        leftJoystick.addEventListener('touchmove', (e) => handleJoystickMove(e, true));
        leftJoystick.addEventListener('touchend', (e) => handleJoystickEnd(e, true));
        leftJoystick.addEventListener('touchcancel', (e) => handleJoystickEnd(e, true));

        rightJoystick.addEventListener('touchstart', (e) => handleJoystickStart(e, false));
        rightJoystick.addEventListener('touchmove', (e) => handleJoystickMove(e, false));
        rightJoystick.addEventListener('touchend', (e) => handleJoystickEnd(e, false));
        rightJoystick.addEventListener('touchcancel', (e) => handleJoystickEnd(e, false));

        // ── Raycaster for click ──
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onPointerDown(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            mouse.set(x, y);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(repoMeshes);
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                const repoId = hit.userData.repoId;
                if (repoId) {
                    focusOnRepo(repoId);
                    window.focusRepo(repoId);
                }
            }
        }

        renderer.domElement.addEventListener('click', onPointerDown);
        renderer.domElement.addEventListener('dblclick', (event) => {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            mouse.set(x, y);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(repoMeshes);
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                const pos = hit.position.clone();
                const zoomPos = pos.clone().add(new THREE.Vector3(0, 0, 3));
                window.cameraPosition = zoomPos;
                window.cameraTarget = pos;
                showToast(`🔍 Zoom: ${hit.userData.label}`);
            }
        });

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.target.closest('#joystick-left') || e.target.closest('#joystick-right') || e.target.closest(
                    '#center-btn') || e.target.closest('#toggle-grids')) return;
            const touch = e.changedTouches[0];
            if (touch) {
                const rect = renderer.domElement.getBoundingClientRect();
                const x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
                const y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
                mouse.set(x, y);
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(repoMeshes);
                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    const repoId = hit.userData.repoId;
                    if (repoId) {
                        focusOnRepo(repoId);
                        window.focusRepo(repoId);
                    }
                }
            }
        }, { passive: true });

        // ── Resize ──
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ── Animation Loop ──
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Particles with gravity flow
            const positions = particles.geometry.attributes.position.array;
            const time = Date.now() * 0.0001;
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                positions[idx + 1] += Math.sin(time + positions[idx]) * 0.002;
                positions[idx] += Math.cos(time + positions[idx + 2]) * 0.002;
                positions[idx + 2] += Math.sin(time + positions[idx + 1]) * 0.002;
                // Keep in bounds
                if (Math.abs(positions[idx]) > 40) positions[idx] *= -0.9;
                if (Math.abs(positions[idx + 1]) > 40) positions[idx + 1] *= -0.9;
                if (Math.abs(positions[idx + 2]) > 40) positions[idx + 2] *= -0.9;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Core pulse
            const pulse = 1 + Math.sin(Date.now() * 0.0015) * 0.05;
            core.scale.setScalar(pulse);
            glow.scale.setScalar(1 + Math.sin(Date.now() * 0.001) * 0.1);
            glowMat.opacity = 0.2 + Math.sin(Date.now() * 0.001) * 0.05;

            renderer.render(scene, camera);
        }
        animate();

        // ── Expose ──
        window.__helix = {
            scene,
            camera,
            renderer,
            helixGroup,
            core,
            buildHelix,
            focusOnRepo,
            repoMeshes,
            controls,
            currentView,
            toggleView: window.toggleView,
            updateCameraView
        };
    </script>

                if (!response.ok) throw new Error('GitHub API error');
                const data = await response.json();
                const fetched = data.map((repo, i) => {

        // ── State ──
        let activeAppIds = [];
        let focusedRepoId = 1;
